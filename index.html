<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0f;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .player {
            width: min(1000px, 95vw);
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 90vh;
            background: #000;
        }
    </style>
</head>

<body>

    <div class="player">
        <video
            id="video"
            controls
            preload="metadata"
            playsinline
        >
            <source src="./videocall.mp4" type="video/mp4">

            Your browser does not support HTML5 video.
        </video>
    </div>

</body>
</html>
