<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Poppins", sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 80, 120, 0.25), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 90, 0.20), transparent 30%),
                linear-gradient(135deg, #18000b, #420016, #160008);

            color: white;
            position: relative;
        }

        /* -------------------------
           Background hearts
        ------------------------- */

        .hearts {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            color: rgba(255, 90, 130, 0.25);
            font-size: 20px;
            animation: floatHeart linear infinite;
            filter: blur(0.2px);
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(110vh) rotate(0deg) scale(0.7);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-15vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* -------------------------
           Main card
        ------------------------- */

        .container {
            position: relative;
            z-index: 5;

            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: min(90%, 520px);
            padding: 50px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.075);
            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 30px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45),
                inset 0 0 30px rgba(255, 100, 140, 0.04);

            animation: cardAppear 1.2s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .mini-heart {
            font-size: 45px;
            margin-bottom: 15px;

            animation: heartbeat 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255, 50, 90, 0.8));
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }

        h1 {
            font-family: "Great Vibes", cursive;
            font-size: clamp(45px, 10vw, 72px);
            font-weight: 400;

            color: #ffcad7;

            text-shadow:
                0 0 10px rgba(255, 80, 120, 0.5),
                0 0 30px rgba(255, 50, 100, 0.25);

            margin-bottom: 12px;
        }

        .question {
            font-size: clamp(18px, 4vw, 23px);
            font-weight: 400;
            color: rgba(255,255,255,0.9);
            margin-bottom: 35px;
        }

        /* -------------------------
           Buttons
        ------------------------- */

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;

            min-height: 60px;
        }

        button {
            border: none;
            outline: none;

            padding: 14px 35px;

            border-radius: 999px;

            font-family: "Poppins", sans-serif;
            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                opacity 0.3s ease;
        }

        #yesBtn {
            color: white;

            background: linear-gradient(
                135deg,
                #ff416c,
                #ff1744
            );

            box-shadow:
                0 8px 25px rgba(255, 23, 68, 0.4);
        }

        #yesBtn:hover {
            transform: translateY(-3px) scale(1.05);

            box-shadow:
                0 12px 35px rgba(255, 23, 68, 0.6);
        }

        #noBtn {
            color: #ffccd7;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.15);
        }

        #noBtn:hover {
            transform: scale(0.95);
        }

        /* -------------------------
           Final screen
        ------------------------- */

        #loveScreen {
            position: fixed;
            inset: 0;

            display: none;

            overflow: hidden;

            z-index: 20;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 30, 80, 0.25),
                    transparent 55%
                ),
                linear-gradient(
                    135deg,
                    #120006,
                    #35000f,
                    #120006
                );
        }

        .love-message {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 100;

            font-family: "Great Vibes", cursive;

            font-size: clamp(55px, 12vw, 110px);

            color: #ff315b;

            white-space: nowrap;

            text-shadow:
                0 0 15px rgba(255, 0, 60, 0.8),
                0 0 45px rgba(255, 0, 60, 0.5);

            animation: finalHeartbeat 2s ease-in-out infinite;
        }

        @keyframes finalHeartbeat {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        /* Falling/rising I love you texts */

        .love-text {
            position: absolute;

            bottom: -100px;

            color: #ff315b;

            font-family: "Great Vibes", cursive;

            white-space: nowrap;

            opacity: 0;

            text-shadow:
                0 0 10px rgba(255, 30, 80, 0.7),
                0 0 25px rgba(255, 0, 60, 0.4);

            animation: loveRise linear forwards;

            pointer-events: none;
        }

        @keyframes loveRise {
            0% {
                transform:
                    translateY(0)
                    rotate(var(--rotation))
                    scale(0.7);

                opacity: 0;
            }

            10% {
                opacity: 0.85;
            }

            85% {
                opacity: 0.75;
            }

            100% {
                transform:
                    translateY(-120vh)
                    rotate(var(--rotation))
                    scale(1.15);

                opacity: 0;
            }
        }

        /* Small sparkles */

        .sparkle {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #fff;

            box-shadow:
                0 0 8px #fff,
                0 0 18px #ff416c;

            animation: sparkleAnimation 1.8s ease-in-out infinite;
        }

        @keyframes sparkleAnimation {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Mobile */

        @media (max-width: 500px) {
            .card {
                padding: 40px 20px;
            }

            .buttons {
                gap: 12px;
            }

            button {
                padding: 13px 27px;
            }

            .love-message {
                font-size: 55px;
            }
        }
    </style>
</head>

<body>

    <!-- Background floating hearts -->
    <div class="hearts" id="hearts"></div>


    <!-- Main question -->
    <div class="container" id="mainScreen">

        <div class="card">

            <div class="mini-heart">❤️</div>

            <h1>For You</h1>

            <div class="question">
                Do you love me?
            </div>

            <div class="buttons">

                <button id="yesBtn">
                    Yes ❤️
                </button>

                <button id="noBtn">
                    No
                </button>

            </div>

        </div>

    </div>


    <!-- Final love screen -->
    <div id="loveScreen">

        <div class="love-message">
            I love you ❤️
        </div>

    </div>


    <!-- Your music -->
    <audio id="loveAudio" src="loveyou.mp3" preload="auto"></audio>


    <script>

        /* =========================================
           BACKGROUND HEARTS
        ========================================= */

        const heartsContainer = document.getElementById("hearts");

        const heartSymbols = ["♥", "❤", "♡", "💕", "💗"];

        function createBackgroundHeart() {

            const heart = document.createElement("div");

            heart.classList.add("heart");

            heart.innerText =
                heartSymbols[
                    Math.floor(Math.random() * heartSymbols.length)
                ];

            heart.style.left =
                Math.random() * 100 + "%";

            heart.style.fontSize =
                (12 + Math.random() * 25) + "px";

            heart.style.animationDuration =
                (7 + Math.random() * 10) + "s";

            heart.style.animationDelay =
                Math.random() * 5 + "s";

            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 18000);
        }


        // Create hearts continuously
        setInterval(createBackgroundHeart, 450);

        // Initial hearts
        for (let i = 0; i < 20; i++) {
            createBackgroundHeart();
        }


        /* =========================================
           NO BUTTON
        ========================================= */

        const noBtn = document.getElementById("noBtn");

        noBtn.addEventListener("click", function () {

            /*
                Every time "No" is clicked,
                it disappears.

                A new position isn't needed because
                the button simply vanishes.
            */

            noBtn.style.transform = "scale(0)";
            noBtn.style.opacity = "0";
            noBtn.style.pointerEvents = "none";

            setTimeout(() => {
                noBtn.style.display = "none";
            }, 300);
        });


        /* =========================================
           YES BUTTON
        ========================================= */

        const yesBtn = document.getElementById("yesBtn");

        const mainScreen = document.getElementById("mainScreen");

        const loveScreen = document.getElementById("loveScreen");

        const audio = document.getElementById("loveAudio");


        yesBtn.addEventListener("click", function () {

            // Hide the question
            mainScreen.style.transition = "opacity 0.8s ease";
            mainScreen.style.opacity = "0";

            setTimeout(() => {

                mainScreen.style.display = "none";

                loveScreen.style.display = "block";

                // Start music
                audio.currentTime = 0;

                audio.play().catch(error => {
                    console.log("Audio could not autoplay:", error);
                });

                startLoveRain();

            }, 800);
        });


        /* =========================================
           I LOVE YOU RAIN
        ========================================= */

        function createLoveText() {

            const text = document.createElement("div");

            text.classList.add("love-text");

            text.innerText = "I love you ❤️";

            // Random horizontal position
            text.style.left =
                Math.random() * 100 + "%";

            // Random size
            text.style.fontSize =
                (18 + Math.random() * 38) + "px";

            // Random animation speed
            text.style.animationDuration =
                (4 + Math.random() * 5) + "s";

            // Random delay
            text.style.animationDelay =
                (Math.random() * 1) + "s";

            // Slight random rotation
            text.style.setProperty(
                "--rotation",
                (Math.random() * 20 - 10) + "deg"
            );

            loveScreen.appendChild(text);

            setTimeout(() => {
                text.remove();
            }, 10000);
        }


        function startLoveRain() {

            // Create lots immediately
            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    createLoveText();
                }, i * 100);
            }

            // Keep creating them
            setInterval(() => {

                createLoveText();

                // Occasionally create multiple
                if (Math.random() > 0.55) {
                    createLoveText();
                }

            }, 250);


            // Add sparkles
            setInterval(createSparkle, 350);
        }


        /* =========================================
           SPARKLES
        ========================================= */

        function createSparkle() {

            const sparkle = document.createElement("div");

            sparkle.classList.add("sparkle");

            sparkle.style.left =
                Math.random() * 100 + "%";

            sparkle.style.top =
                Math.random() * 100 + "%";

            sparkle.style.animationDelay =
                Math.random() * 1.5 + "s";

            loveScreen.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 2500);
        }

    </script>

</body>
  </html>
